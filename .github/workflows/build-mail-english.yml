name: Build Financial Platform

on:
  workflow_dispatch:
    inputs:
      fast_build:
        description: "快速打包：复用同一提交已通过的 Windows Tests；仍检查 EXE 启动"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build-windows-exe.yml
    secrets: inherit
    with:
      fast_build: ${{ inputs.fast_build }}
