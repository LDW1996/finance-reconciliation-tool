name: Build Financial Platform

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mail-english.yml'
      - 'backend/launcher.py'
      - 'backend/app/main.py'
      - 'backend/app/ilog*.py'
      - '.github/workflows/build-windows-exe.yml'
      - 'packaging/finance-reconcile.spec'
      - 'packaging/smoke_windows_exe.py'
      - 'frontend/src/views/ReconciliationView.vue'
      - 'frontend/src/views/UnlockView.vue'
      - 'backend/app/platform*.py'
      - 'backend/app/platform_accounts.json'
      - 'frontend/src/platformLocale.ts'
      - 'frontend/src/services/platform*.ts'
      - 'frontend/src/components/Platform*.vue'
      - 'frontend/src/components/IlogRetentionSettings.vue'
      - 'frontend/src/App.vue'
      - 'frontend/src/main.ts'
      - 'frontend/tooling/runtimePlatformLocale.ts'
      - 'frontend/tooling/platformEnglish.json'
      - 'frontend/tooling/excelEnglish.json'
      - 'backend/app/mail*.py'
      - 'backend/app/customer*.py'
      - 'backend/app/google_sheets.py'
      - 'backend/app/mail_english*'
      - 'backend/app/mail_probe.py'
      - 'frontend/src/MailEnglishApp.vue'
      - 'frontend/src/views/MailView.vue'
      - 'frontend/src/components/Mail*.vue'
      - 'frontend/src/components/Receipt*.vue'
      - 'frontend/src/components/Customer*.vue'
      - 'frontend/src/services/mail*.ts'
      - 'frontend/tooling/mailEnglish*'
      - 'frontend/tooling/check-mail-english.mjs'
      - 'frontend/vite.config.ts'
      - 'packaging/mail-reconcile.spec'
      - 'packaging/smoke_mail_exe.py'
      - 'packaging/Mail-Reconciliation-Guide.txt'

permissions:
  contents: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build-windows-exe.yml
    secrets: inherit
    with:
      edition: full
      fast_build: false
