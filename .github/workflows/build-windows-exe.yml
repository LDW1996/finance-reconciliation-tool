name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            packaging/requirements-build.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r packaging\requirements-build.txt

      - name: Run tests
        run: python -m pytest backend\tests -q
        env:
          PYTHONPATH: backend

      - name: Build EXE
        run: pyinstaller --clean --noconfirm packaging\finance-reconcile.spec

      - name: Smoke test EXE
        run: python packaging\smoke_windows_exe.py "dist\ilog解锁工具.exe"

      - name: Copy user guide
        run: copy packaging\财务人员使用说明.txt dist\财务人员使用说明.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ilog解锁工具
          compression-level: 0
          path: |
            dist/ilog解锁工具.exe
            dist/财务人员使用说明.txt

      - name: Upload bundle inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          if-no-files-found: ignore
          path: |
            build/bundle-size-report.json
            build/smoke-diagnostics/
            build/finance-reconcile/warn-finance-reconcile.txt
