name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      fast_build:
        description: "快速打包：复用同一提交已通过的 Windows Tests；仍检查 EXE 启动"
        required: true
        default: false
        type: boolean

  workflow_call:
    secrets:
      PLATFORM_SMOKE_ACCOUNTS:
        required: true
    inputs:
      fast_build:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build unified platform
    runs-on: windows-latest
    env:
      EXE_NAME: 财务综合业务平台
      GUIDE_NAME: 使用说明.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify prior Windows tests for fast build
        if: ${{ inputs.fast_build }}
        uses: actions/github-script@v7
        with:
          script: |
            const validate = require('./.github/scripts/windows-validation.cjs');
            await validate({github, context, core});

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            packaging/requirements-build.txt
            packaging/requirements-excel-build.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Validate frontend tooling and English localization
        run: npm run check
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
          VITE_EDITION: full

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r packaging\requirements-build.txt

      - name: Run tests
        if: ${{ !inputs.fast_build }}
        shell: pwsh
        run: python -m pytest backend\tests -q -n 2 --dist=loadfile --durations=25 --durations-min=0.1
        env:
          PYTHONPATH: backend

      - name: Prepare private platform accounts
        env:
          PLATFORM_SMOKE_ACCOUNTS: ${{ secrets.PLATFORM_SMOKE_ACCOUNTS }}
        run: python packaging/prepare_platform_accounts.py

      - name: Build EXE
        shell: pwsh
        run: pyinstaller --clean --noconfirm packaging\finance-reconcile.spec

      - name: Smoke test EXE
        env:
          PLATFORM_SMOKE_ACCOUNTS: ${{ secrets.PLATFORM_SMOKE_ACCOUNTS }}
        shell: pwsh
        run: python packaging\smoke_windows_exe.py "dist\$env:EXE_NAME.exe"

      - name: Copy user guide
        shell: pwsh
        run: Copy-Item "packaging\财务人员使用说明.txt" "dist\$env:GUIDE_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE_NAME }}
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/${{ env.EXE_NAME }}.exe
            dist/${{ env.GUIDE_NAME }}

      - name: Upload bundle inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          if-no-files-found: ignore
          path: |
            build/bundle-size-report.json
            build/smoke-diagnostics/
            build/finance-reconcile/warn-finance-reconcile.txt
