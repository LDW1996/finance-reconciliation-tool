name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "打包版本：full 完整版 / excel 仅对账 / mail_en 英文邮件核销 / all 全部版本"
        required: true
        default: full
        type: choice
        options:
          - full
          - excel
          - mail_en
          - all
      fast_build:
        description: "快速打包：复用同一提交已通过的 Windows Tests；仍检查 EXE 启动"
        required: true
        default: false
        type: boolean

  workflow_call:
    inputs:
      edition:
        type: string
        required: false
        default: full
      fast_build:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build ${{ matrix.edition }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(inputs.edition == 'all' && '["full","excel","mail_en"]' || inputs.edition == 'excel' && '["excel"]' || inputs.edition == 'mail_en' && '["mail_en"]' || '["full"]') }}
    env:
      EXE_NAME: ${{ matrix.edition == 'excel' && 'Excel对账工具' || matrix.edition == 'mail_en' && '邮件核销工具（英文版）' || '财务综合业务平台' }}
      GUIDE_NAME: ${{ matrix.edition == 'mail_en' && 'User Guide.txt' || '使用说明.txt' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify prior Windows tests for fast build
        if: ${{ inputs.fast_build }}
        uses: actions/github-script@v7
        with:
          script: |
            const validate = require('./.github/scripts/windows-validation.cjs');
            await validate({github, context, core});

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            packaging/requirements-build.txt
            packaging/requirements-excel-build.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Validate English mail localization
        if: ${{ matrix.edition == 'mail_en' }}
        run: node tooling/check-mail-english.mjs
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
          VITE_EDITION: ${{ matrix.edition }}

      - name: Install Python dependencies
        shell: pwsh
        run: |
          if ('${{ matrix.edition }}' -eq 'excel') {
            python -m pip install --disable-pip-version-check -r packaging\requirements-excel-build.txt
          } else {
            python -m pip install --disable-pip-version-check -r packaging\requirements-build.txt
          }

      - name: Run tests
        if: ${{ !inputs.fast_build }}
        shell: pwsh
        run: |
          if ('${{ matrix.edition }}' -eq 'excel') {
            python -m pytest backend\tests\test_excel_edition.py backend\tests\test_reconciliation.py backend\tests\test_launcher.py -q
          } else {
            python -m pytest backend\tests -q
          }
        env:
          PYTHONPATH: backend

      - name: Build EXE
        shell: pwsh
        run: |
          if ('${{ matrix.edition }}' -eq 'mail_en') {
            pyinstaller --clean --noconfirm packaging\mail-reconcile.spec
          } elseif ('${{ matrix.edition }}' -eq 'excel') {
            pyinstaller --clean --noconfirm packaging\excel-reconcile.spec
          } else {
            pyinstaller --clean --noconfirm packaging\finance-reconcile.spec
          }

      - name: Smoke test EXE
        shell: pwsh
        run: |
          if ('${{ matrix.edition }}' -eq 'mail_en') {
            python packaging\smoke_mail_exe.py "dist\$env:EXE_NAME.exe"
          } elseif ('${{ matrix.edition }}' -eq 'excel') {
            python packaging\smoke_windows_exe.py "dist\$env:EXE_NAME.exe" --excel-only
          } else {
            python packaging\smoke_windows_exe.py "dist\$env:EXE_NAME.exe"
          }

      - name: Copy user guide
        shell: pwsh
        run: |
          if ('${{ matrix.edition }}' -eq 'mail_en') {
            Copy-Item "packaging\Mail-Reconciliation-Guide.txt" "dist\$env:GUIDE_NAME"
          } elseif ('${{ matrix.edition }}' -eq 'excel') {
            Copy-Item "packaging\Excel对账使用说明.txt" "dist\使用说明.txt"
          } else {
            Copy-Item "packaging\财务人员使用说明.txt" "dist\使用说明.txt"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE_NAME }}
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/${{ env.EXE_NAME }}.exe
            dist/${{ env.GUIDE_NAME }}

      - name: Upload bundle inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ matrix.edition }}
          if-no-files-found: ignore
          path: |
            build/bundle-size-report.json
            build/smoke-diagnostics/
            build/finance-reconcile/warn-finance-reconcile.txt
            build/excel-reconcile/warn-excel-reconcile.txt
            build/mail-reconcile/warn-mail-reconcile.txt
