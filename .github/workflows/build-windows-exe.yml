name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run frontend:build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend\requirements.txt pyinstaller==6.11.1

      - name: Run tests
        run: python -m pytest backend\tests -q
        env:
          PYTHONPATH: backend

      - name: Build EXE
        run: pyinstaller --clean --noconfirm packaging\finance-reconcile.spec

      - name: Smoke test EXE
        run: python packaging\smoke_windows_exe.py "dist\财务对账工具.exe"

      - name: Copy user guide
        run: copy packaging\财务人员使用说明.txt dist\财务人员使用说明.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 财务对账工具-Windows
          path: |
            dist/财务对账工具.exe
            dist/财务人员使用说明.txt
